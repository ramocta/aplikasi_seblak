name: seblak_say_cafe
description: "A collaborative group project for Seblak Say Cafe ordering system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Ikon bawaan
  cupertino_icons: ^1.0.8

  # 1. State Management & Utilities
  get: ^4.6.6

  # 2. Navigasi Profesional
  go_router: ^13.2.0

  # 3. Networking
  dio: ^5.4.1

  # 4. Desain & Font
  google_fonts: ^6.2.1

  # 5. Ikon Tambahan
  font_awesome_flutter: ^10.7.0

  # 6. Local Storage
  shared_preferences: ^2.5.5

  # 7. Date Formatting
  intl: ^0.19.0

  # 8. Image Cache
  cached_network_image: ^3.3.1

  # 9. QR Code Generator
  qr_flutter: ^4.1.0

  # 10. Environment Variable
  flutter_dotenv: ^5.1.0

  # 11. Dio Logger
  pretty_dio_logger: ^1.3.1

  # 12. JSON Serialization
  json_annotation: ^4.9.0
  get_storage: ^2.1.1

  # ✅ 13. Image Picker — untuk upload bukti pembayaran QRIS
  image_picker: ^1.1.2

  gal: ^2.3.0

  # 14 fitur PDF
  pdf: ^3.10.8
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env